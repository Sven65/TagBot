[package]
name = "tagbot"
version = "4.0.6"
edition = "2021"
license = "OPL-3.0"
publish = false

[features]
default = []
run_untrusted_code = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dotenvy = "0.15.7"
reql = "0.11.2"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
lazy_static = "1.5.1"
futures = "0.3.34"
serde = "1.0.229"
# rlua = "0.19.4"
rlua = "0.20.1"
regex = "1"
chrono = "0.4.45"
rand = "0.10.3"
gag = "1.0.0"
tagbot-macros = { path = "tagbot-macros" }
bitflags = "2.13.2"
cat-loggr = { version = "1.0.2", features = ["macros"] }
serde_json = "1.0.154"


[dependencies.serenity]
default-features = false
version = "0.12.5"
features = [
    "builder",
    "cache",
    "client",
    "gateway",
    "http",
    "model",
    "utils",
    "rustls_backend",
]

[dev-dependencies]
test-case = "3.4.0"
serde_json = "1.0.154"
